<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save Reel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p  { font-size: 0.9rem; color: #888; margin-bottom: 24px; }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #f0f0f0;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #555; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background: #e1306c;
      color: white;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: #444; cursor: default; }
    #msg {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 24px;
      text-align: center;
    }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <h1>Save Reel</h1>
  <p>Paste an Instagram Reel URL below</p>
  <input type="url" id="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off" />
  <button id="btn" onclick="queue()">Save</button>
  <div id="msg"></div>

  <script>
    async function queue() {
      const input = document.getElementById("url");
      const btn   = document.getElementById("btn");
      const msg   = document.getElementById("msg");
      const url   = input.value.trim();

      if (!url) { show("Paste a URL first", "err"); return; }

      btn.disabled = true;
      msg.className = "";
      msg.textContent = "Saving…";

      try {
        const res = await fetch("/api/reel", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer WEBHOOK_SECRET_PLACEHOLDER"
          },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (res.ok) {
          show("Queued! ID: " + data.id, "ok");
          input.value = "";
        } else {
          show(data.detail || "Error " + res.status, "err");
        }
      } catch (e) {
        show("Could not reach server", "err");
      } finally {
        btn.disabled = false;
      }
    }

    function show(text, cls) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = cls;
    }

    // Allow submitting with Enter key
    document.getElementById("url").addEventListener("keydown", e => {
      if (e.key === "Enter") queue();
    });
  </script>
</body>
</html>
